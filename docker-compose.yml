services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bilimedu
      POSTGRES_USER: bilimedu
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devonly}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bilimedu -d bilimedu"]
      interval: 3s
      timeout: 3s
      retries: 20

  flyway:
    image: flyway/flyway:10-alpine
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql:ro
    command: >
      -url=jdbc:postgresql://db:5432/bilimedu
      -user=bilimedu
      -password=${DB_PASSWORD:-devonly}
      -connectRetries=10
      migrate

volumes:
  pgdata:
